<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>提交需求</title>
  <style>
    :root { color-scheme: light; --bg:#f4f0e8; --card:#fffdf8; --ink:#1f2a2d; --muted:#6f7775; --line:#ddd6c8; --accent:#156a63; --danger:#a63c31; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(160deg,#efe9dc,#f8f5ee 50%,#e8f0ec); color:var(--ink); font:15px/1.55 "Microsoft YaHei UI","PingFang SC",sans-serif; }
    main { width:min(680px,calc(100% - 28px)); margin:0 auto; padding:28px 0 48px; }
    header { margin-bottom:16px; }
    h1 { margin:0 0 6px; font-size:26px; letter-spacing:.02em; }
    .sub { color:var(--muted); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 12px 34px rgba(42,52,48,.08); margin:14px 0; }
    h2 { margin:0 0 14px; font-size:18px; }
    label { display:block; margin:12px 0 6px; font-weight:600; }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:11px; padding:11px 12px; background:#fff; color:var(--ink); font:inherit; }
    textarea { min-height:110px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .check { display:flex; gap:8px; align-items:flex-start; font-weight:400; }
    .check input { width:auto; margin-top:4px; }
    button { border:0; border-radius:12px; padding:12px 16px; background:var(--accent); color:white; font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:#e8eee9; color:var(--accent); }
    button:disabled { opacity:.55; cursor:wait; }
    .actions { display:flex; gap:10px; margin-top:18px; }
    .note { color:var(--muted); font-size:13px; margin-top:10px; }
    .error { color:var(--danger); }
    .result { background:#edf6f1; border:1px solid #c9e1d3; border-radius:14px; padding:14px; margin-top:14px; }
    .code { font:700 22px/1.2 ui-monospace,Consolas,monospace; letter-spacing:.08em; }
    .message { border-top:1px solid var(--line); padding:10px 0; }
    .message:first-child { border-top:0; }
    .meta { color:var(--muted); font-size:12px; }
    .hidden { display:none !important; }
    @media (max-width:520px) { .row { grid-template-columns:1fr; } main { padding-top:18px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1 id="form-title">提交需求</h1>
    <div class="sub" id="form-sub">正在加载公开表单…</div>
  </header>

  <section class="card" id="public-form-card">
    <h2>告诉我们你需要什么</h2>
    <form id="public-form">
      <div class="row">
        <div><label for="requester-name">你的称呼</label><input id="requester-name" maxlength="80" required></div>
        <div><label for="requester-email">联系邮箱</label><input id="requester-email" type="email" maxlength="160" required></div>
      </div>
      <label for="request-type">需求类型</label>
      <select id="request-type"></select>
      <label for="request-title">标题</label>
      <input id="request-title" maxlength="120" required placeholder="一句话说明问题或需求">
      <label for="request-detail">详情</label>
      <textarea id="request-detail" maxlength="4000" required placeholder="背景、期望结果、影响范围和期望时间"></textarea>
      <label class="check"><input id="request-consent" type="checkbox"> 我同意提交以上联系方式和需求内容，用于受理和状态通知。</label>
      <div class="actions"><button id="submit-request" type="submit">提交需求</button><button class="secondary" id="clear-form" type="button">清空</button></div>
      <div class="note">提交后只进入待分诊区；公开状态页不会显示内部项目、员工或内部备注。</div>
      <div id="form-error" class="note error"></div>
    </form>
    <div id="submit-result" class="result hidden"></div>
  </section>

  <section class="card">
    <h2>查询进度</h2>
    <div class="row">
      <div><label for="tracking-code">申请编号</label><input id="tracking-code" maxlength="20" placeholder="提交后获得的编号"></div>
      <div><label for="status-email">联系邮箱</label><input id="status-email" type="email" maxlength="160"></div>
    </div>
    <div class="actions"><button id="lookup-status" type="button">查询</button></div>
    <div id="status-error" class="note error"></div>
    <div id="status-result" class="result hidden"></div>
  </section>
</main>
<script src="cloud-config.js?v=cloud-gateway-1"></script>
<script src="public-intake.js"></script>
</body>
</html>
